<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Survey Data Platform</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f8f2; color: #172014; }
    main { max-width: 960px; margin: 0 auto; padding: 32px; }
    header, section { background: #fff; border: 1px solid #d8e2cf; border-radius: 8px; padding: 22px; margin-bottom: 18px; }
    h1, h2 { margin-top: 0; }
    label { display: block; margin: 12px 0; font-weight: 700; }
    input, select, textarea, button { width: 100%; font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #b9c8ae; }
    button { background: #2f6f3e; color: #fff; border-color: #2f6f3e; cursor: pointer; margin-top: 8px; }
    pre { white-space: pre-wrap; background: #102015; color: #e2f5dc; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>E-Survey Data Platform</h1>
      <p>Collect, validate, filter, and summarize survey responses for stakeholder reporting.</p>
    </header>
    <section>
      <h2>Submit Response</h2>
      <label>Department
        <select id="department">
          <option>Support</option>
          <option>Engineering</option>
          <option>Sales</option>
          <option>Operations</option>
        </select>
      </label>
      <label>Satisfaction
        <input id="satisfaction" type="number" min="1" max="5" value="4">
      </label>
      <label>NPS
        <input id="nps" type="number" min="0" max="10" value="8">
      </label>
      <label>Recommendation
        <textarea id="recommendation">Add clearer deployment notes.</textarea>
      </label>
      <button id="submit">Submit</button>
    </section>
    <section>
      <h2>Report</h2>
      <button id="summary">Refresh Summary</button>
      <pre id="output">Loading...</pre>
    </section>
  </main>
  <script>
    const output = document.querySelector("#output");

    async function api(path, options = {}) {
      const result = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      return result.json();
    }

    async function refreshSummary() {
      const data = await api("/api/reports/summary");
      output.textContent = JSON.stringify(data, null, 2);
    }

    document.querySelector("#submit").addEventListener("click", async () => {
      const response = await api("/api/responses", {
        method: "POST",
        body: JSON.stringify({
          department: document.querySelector("#department").value,
          satisfaction: Number(document.querySelector("#satisfaction").value),
          nps: Number(document.querySelector("#nps").value),
          recommendation: document.querySelector("#recommendation").value
        })
      });
      output.textContent = JSON.stringify(response, null, 2);
    });

    document.querySelector("#summary").addEventListener("click", refreshSummary);
    refreshSummary();
  </script>
</body>
</html>
